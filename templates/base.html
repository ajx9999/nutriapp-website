<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NUTRIAPP{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Main navigation -->
    <header class="site-header">
        <div class="container navigation">
            <a class="brand" href="{{ url_for('home') }}">NUTRIAPP</a>

            <!-- Navigation links -->
            <nav>
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('team') }}">Team Members</a>
                <a href="{{ url_for('documentation') }}">Documentation</a>
            </nav>
        </div>
    </header>

    <!-- Main page content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 NUTRIAPP. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
